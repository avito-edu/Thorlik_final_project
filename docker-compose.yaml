version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: marketplace_postgres
    environment:
      POSTGRES_USER: user123
      POSTGRES_PASSWORD: marketplace123
      POSTGRES_DB: marketplace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_tables.up.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user123 -d marketplace_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace_app
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user123
      - DB_PASSWORD=marketplace123
      - DB_NAME=marketplace_db
      - DB_SSLMODE=disable
      - JWT_SECRET=secret-key
      - JWT_EXPIRY_HOURS=24
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketplace_network

networks:
  marketplace_network:
    driver: bridge

volumes:
  postgres_data:
